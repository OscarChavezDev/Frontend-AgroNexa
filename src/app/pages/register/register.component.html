<div class="auth-wrapper">
  <div class="auth-card auth-card--wide">
    <div class="auth-brand">
      <span class="brand-icon">🌱</span>
      <h1>AgroNexa</h1>
      <p>Crea tu cuenta y empieza a monitorear tus cultivos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" formControlName="nombre" placeholder="Tu nombre"
            [class.error]="f['nombre'].invalid && f['nombre'].touched">
          <span class="field-error" *ngIf="f['nombre'].invalid && f['nombre'].touched">Requerido</span>
        </div>
        <div class="form-group">
          <label>Apellido *</label>
          <input type="text" formControlName="apellido" placeholder="Tu apellido"
            [class.error]="f['apellido'].invalid && f['apellido'].touched">
          <span class="field-error" *ngIf="f['apellido'].invalid && f['apellido'].touched">Requerido</span>
        </div>
      </div>

      <div class="form-group">
        <label>Correo electrónico *</label>
        <input type="email" formControlName="correo" placeholder="correo@ejemplo.com"
          [class.error]="f['correo'].invalid && f['correo'].touched">
        <span class="field-error" *ngIf="f['correo'].invalid && f['correo'].touched">
          {{ f['correo'].hasError('required') ? 'Requerido' : 'Correo inválido' }}
        </span>
      </div>

      <div class="form-group">
        <label>Contraseña *</label>
        <div class="input-with-toggle">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Mínimo 6 caracteres"
            [class.error]="f['password'].invalid && f['password'].touched">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="field-error" *ngIf="f['password'].invalid && f['password'].touched">Mínimo 6 caracteres</span>
      </div>

      <div class="form-group">
        <label>Teléfono <span class="optional">(opcional)</span></label>
        <input type="tel" formControlName="telefono" placeholder="999 999 999">
      </div>

      <!-- Tipo de cuenta — tarjetas visuales -->
      <div class="form-group">
        <label>¿Cómo usarás AgroNexa? *</label>
        <div class="rol-cards">
          <label *ngFor="let r of roles" class="rol-card" [class.selected]="f['rol'].value === r.value">
            <input type="radio" formControlName="rol" [value]="r.value" style="display:none">
            <span class="rol-icon">{{ r.icon }}</span>
            <span class="rol-name">{{ r.label }}</span>
            <span class="rol-desc">{{ r.desc }}</span>
          </label>
        </div>
      </div>

      <div class="success-banner" *ngIf="successMsg">{{ successMsg }}</div>
      <div class="error-banner" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Crear cuenta</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
