<div class="auth-wrapper">
  <div class="auth-card auth-card--wide">
    <div class="auth-brand">
      <div class="brand-logo-auth">
        <img src="assets/logo.svg" alt="AgroNexa" class="auth-logo-img">
      </div>
      <h1>Crea tu cuenta</h1>
      <p>Empieza a monitorear y diagnosticar tus cultivos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label for="reg-nombre">Nombre <span class="req">*</span></label>
          <input id="reg-nombre" type="text" formControlName="nombre" placeholder="Tu nombre"
            [class.error]="f['nombre'].invalid && f['nombre'].touched" autocomplete="given-name">
          <span class="field-error" *ngIf="f['nombre'].invalid && f['nombre'].touched">Requerido</span>
        </div>
        <div class="form-group">
          <label for="reg-apellido">Apellido <span class="req">*</span></label>
          <input id="reg-apellido" type="text" formControlName="apellido" placeholder="Tu apellido"
            [class.error]="f['apellido'].invalid && f['apellido'].touched" autocomplete="family-name">
          <span class="field-error" *ngIf="f['apellido'].invalid && f['apellido'].touched">Requerido</span>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-correo">Correo electrónico <span class="req">*</span></label>
        <input id="reg-correo" type="email" formControlName="correo" placeholder="correo@ejemplo.com"
          [class.error]="f['correo'].invalid && f['correo'].touched" autocomplete="email">
        <span class="field-error" *ngIf="f['correo'].invalid && f['correo'].touched">
          {{ f['correo'].hasError('required') ? 'Requerido' : 'Correo inválido' }}
        </span>
      </div>

      <div class="form-group">
        <label for="reg-pw">Contraseña <span class="req">*</span></label>
        <div class="input-with-toggle">
          <input id="reg-pw" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Mínimo 6 caracteres"
            [class.error]="f['password'].invalid && f['password'].touched"
            autocomplete="new-password">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showPassword" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="f['password'].invalid && f['password'].touched">Mínimo 6 caracteres</span>
      </div>

      <div class="form-group">
        <label for="reg-tel">Teléfono <span class="optional">(opcional)</span></label>
        <input id="reg-tel" type="tel" formControlName="telefono" placeholder="999 999 999" autocomplete="tel">
      </div>

      <div class="form-group">
        <label>¿Cómo usarás AgroNexa? <span class="req">*</span></label>
        <div class="rol-cards">
          <label *ngFor="let r of roles" class="rol-card" [class.selected]="f['rol'].value === r.value">
            <input type="radio" formControlName="rol" [value]="r.value" style="display:none">
            <span class="rol-icon" aria-hidden="true">{{ r.icon }}</span>
            <span class="rol-name">{{ r.label }}</span>
            <span class="rol-desc">{{ r.desc }}</span>
          </label>
        </div>
      </div>

      <div class="success-banner" *ngIf="successMsg">{{ successMsg }}</div>
      <div class="error-banner" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button type="submit" class="btn-primary btn-full" [disabled]="loading">
        <span *ngIf="!loading">Crear cuenta</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
