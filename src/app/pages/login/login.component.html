<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo-auth">
        <img src="assets/logo.svg" alt="AgroNexa" class="auth-logo-img">
      </div>
      <h1>AgroNexa</h1>
      <p>Diagnóstico inteligente para tus cultivos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="correo-login">Correo electrónico</label>
        <input id="correo-login" type="email" formControlName="correo" placeholder="correo@ejemplo.com"
          [class.error]="f['correo'].invalid && f['correo'].touched" autocomplete="email">
        <span class="field-error" *ngIf="f['correo'].invalid && f['correo'].touched">
          {{ f['correo'].hasError('required') ? 'El correo es requerido' : 'Ingresa un correo válido' }}
        </span>
      </div>

      <div class="form-group">
        <label for="pw-login">Contraseña</label>
        <div class="input-with-toggle">
          <input id="pw-login" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="••••••••" [class.error]="f['password'].invalid && f['password'].touched"
            autocomplete="current-password">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showPassword" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="field-error" *ngIf="f['password'].invalid && f['password'].touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="error-banner" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button type="submit" class="btn-primary btn-full" [disabled]="loading">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <p class="auth-link">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </div>
</div>
