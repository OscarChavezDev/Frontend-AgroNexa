<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-icon">🌱</span>
      <h1>AgroNexa</h1>
      <p>Diagnóstico inteligente para cultivos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" formControlName="correo" placeholder="correo@ejemplo.com"
          [class.error]="f['correo'].invalid && f['correo'].touched">
        <span class="field-error" *ngIf="f['correo'].invalid && f['correo'].touched">
          {{ f['correo'].hasError('required') ? 'El correo es requerido' : 'Correo inválido' }}
        </span>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-with-toggle">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="••••••••" [class.error]="f['password'].invalid && f['password'].touched">
          <button type="button" class="toggle-pw" (click)="showPassword = !showPassword">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
        <span class="field-error" *ngIf="f['password'].invalid && f['password'].touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="error-banner" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <p class="auth-link">¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </div>
</div>
