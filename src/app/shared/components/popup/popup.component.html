<div class="popup-backdrop" *ngIf="data" [class.show]="data">
  <div class="popup-modal">
    <div class="popup-icon" [ngClass]="'popup-icon--' + data.type">
      <!-- Success Icon -->
      <svg *ngIf="data.type === 'success'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <!-- Error Icon -->
      <svg *ngIf="data.type === 'error'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <!-- Info Icon -->
      <svg *ngIf="data.type === 'info'" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>
    <div class="popup-content">
      <h3 class="popup-title">{{ data.title }}</h3>
      <p class="popup-message">{{ data.message }}</p>
    </div>
  </div>
</div>
